---
networks:
  reverse-proxy:
    external: true

# Services with the `storage-box` profile use the Hetzner Storage Box mounted
# at ${SERVARR_HOME_DIR}/qbittorrent-data. Each one has its own systemd unit
# (servarr_storage_box_containers in vars/main.yml, from
# templates/servarr-storage-box-container.service.j2) that starts and stops it
# with the box mount, and `docker compose up` without the profile leaves them
# out. `restart: on-failure` restarts a crashed container but, unlike
# `unless-stopped`, not on a Docker daemon restart, when the box may be
# unmounted.
services:
  servarr-transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: servarr-transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER=${SERVARR_TRANSMISSION_USER}
      - PASS=${SERVARR_TRANSMISSION_PASSWORD}
    volumes:
      - ${SERVARR_HOME_DIR}/config/transmission:/config
      - ${SERVARR_HOME_DIR}/data:/data
    expose:
      - 9091
    ports:
      - 51414:51414
      - 51414:51414/udp
    restart: unless-stopped
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servarr-transmission.rule=Host(`${SERVARR_TRANSMISSION_UI_DOMAIN}`)"
      - "traefik.http.routers.servarr-transmission.entrypoints=websecure"
      - "traefik.http.routers.servarr-transmission.tls=true"

  servarr-qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: servarr-qbittorrent
    profiles:
      - storage-box
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=51415
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ${SERVARR_HOME_DIR}/config/qbittorrent:/config
      - ${SERVARR_HOME_DIR}/qbittorrent-data:/data
    expose:
      - 8080
    ports:
      - 51415:51415
      - 51415:51415/udp
    restart: on-failure
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servarr-qbittorrent.rule=Host(`${SERVARR_QBITTORRENT_UI_DOMAIN}`)"
      - "traefik.http.routers.servarr-qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.servarr-qbittorrent.tls=true"
      - "traefik.http.services.servarr-qbittorrent.loadbalancer.server.port=8080"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${SERVARR_HOME_DIR}/config/prowlarr:/config
    restart: unless-stopped
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`${PROWLARR_UI_DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"

  # Same /data as qBittorrent: imports into /data/library/tv are hardlinks
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    profiles:
      - storage-box
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${SERVARR_HOME_DIR}/config/sonarr:/config
      - ${SERVARR_HOME_DIR}/qbittorrent-data:/data
    restart: on-failure
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`${SONARR_UI_DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"

  # Same /data as qBittorrent: imports into /data/library/movies are hardlinks
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    profiles:
      - storage-box
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${SERVARR_HOME_DIR}/config/radarr:/config
      - ${SERVARR_HOME_DIR}/qbittorrent-data:/data
    restart: on-failure
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`${RADARR_UI_DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"

  whisparr:
    image: ghcr.io/hotio/whisparr:v3
    container_name: whisparr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${SERVARR_HOME_DIR}/config/whisparr:/config
      - ${SERVARR_HOME_DIR}/data:/data
    restart: unless-stopped
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whisparr.rule=Host(`${WHISPARR_UI_DOMAIN}`)"
      - "traefik.http.routers.whisparr.entrypoints=websecure"
      - "traefik.http.routers.whisparr.tls=true"

  # Same /data as Sonarr and Radarr: sees their files at the paths they report
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    profiles:
      - storage-box
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${SERVARR_HOME_DIR}/config/bazarr:/config
      - ${SERVARR_HOME_DIR}/qbittorrent-data:/data
    restart: on-failure
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`${BAZARR_UI_DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    networks:
      - reverse-proxy

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${SERVARR_HOME_DIR}/config/seerr:/app/config
    restart: unless-stopped
    networks:
      - reverse-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`${SEERR_UI_DOMAIN}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.tls=true"

  servarr-jellyfin:
    image: jellyfin/jellyfin:12.0
    container_name: servarr-jellyfin
    profiles:
      - storage-box
    networks:
      - reverse-proxy
    volumes:
      - ${SERVARR_HOME_DIR}/config/jellyfin:/config
      - ${SERVARR_HOME_DIR}/cache/jellyfin:/cache
      - type: bind
        source: ${SERVARR_HOME_DIR}/qbittorrent-data/library
        target: /media
        read_only: true
    restart: on-failure
    environment:
      - JELLYFIN_PublishedServerUrl=https://${SERVARR_JELLYFIN_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servarr-jellyfin.rule=Host(`${SERVARR_JELLYFIN_DOMAIN}`)"
      - "traefik.http.routers.servarr-jellyfin.entrypoints=websecure"
      - "traefik.http.routers.servarr-jellyfin.tls=true"

  # Second temporary Jellyfin: a raw view of the completed torrents. We might reuse the player.statox.fr hostname for the other jellyfin later
  servarr-player:
    image: jellyfin/jellyfin:12.0
    container_name: servarr-player
    profiles:
      - storage-box
    networks:
      - reverse-proxy
    volumes:
      - ${SERVARR_HOME_DIR}/config/player:/config
      - ${SERVARR_HOME_DIR}/cache/player:/cache
      - type: bind
        source: ${SERVARR_HOME_DIR}/qbittorrent-data/torrents/complete
        target: /media
        read_only: true
    restart: on-failure
    environment:
      - JELLYFIN_PublishedServerUrl=https://${SERVARR_PLAYER_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.servarr-player.rule=Host(`${SERVARR_PLAYER_DOMAIN}`)"
      - "traefik.http.routers.servarr-player.entrypoints=websecure"
      - "traefik.http.routers.servarr-player.tls=true"
