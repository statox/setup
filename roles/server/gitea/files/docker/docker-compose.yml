networks:
  reverse-proxy:
    external: true

services:
  # At first connection, the UI allows to create a user which is used as admin
  # TODO See if that can be automated to have the creds in this repo
  #
  # The initial Github migration was done with the script github_migration.sh
  # in this repo.
  # For now future repos will have to be synced manually
  server:
    image: docker.gitea.com/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DISABLE_SSH=false
      - GITEA__server__SSH_PORT=2223
    restart: unless-stopped
    networks:
      - reverse-proxy
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./ssh/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./ssh/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro
    expose:
      - 3000
      - 22
    labels:
      - "traefik.enable=true"
      # TODO Extract the host to a variable like in other playbooks
      - "traefik.http.routers.gitea.rule=Host(`git.statox.fr`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      # No Host() rule because the ssh router can't handle it
      # cf. https://community.traefik.io/t/routing-ssh-traffic-with-traefik-v2/717/6
      - "traefik.tcp.routers.gitea_ssh.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.gitea_ssh.entrypoints=ssh_gitea"
      - "traefik.tcp.services.gitea_ssh.loadbalancer.server.port=22"
