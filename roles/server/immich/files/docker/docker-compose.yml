---
# See documentation
# https://docs.immich.app/install/docker-compose

networks:
  reverse-proxy:
    external: true
  immich:
    name: immich
    external: false

volumes:
  model-cache:

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    expose:
      - 2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - reverse-proxy
      - immich
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`${IMMICH_UI_DOMAIN}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      # Since the container has 2 networks we need to specify which one should be used by traefik
      - "traefik.docker.network=reverse-proxy"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    container_name: immich_machine_learning
    env_file:
      - .env
    volumes:
      - model-cache:/cache
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - immich

    mem_limit: 4g
    mem_reservation: 512m
    cpuset: "0,1"            # pin to 2 cores (cores 0 and 1)
    cpu_shares: 256          # loses the CPU tug-of-war vs default-weight (1024) containers under contention

  redis:
    image: docker.io/valkey/valkey:9
    container_name: immich_redis
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - immich

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
    networks:
      - immich

  backup:
    container_name: immich_backup
    restart: unless-stopped
    build:
      dockerfile: ./builder/backup/Dockerfile
    volumes:
      - ${UPLOAD_LOCATION}:/library:ro
    environment:
      - AWS_ACCESS_KEY_ID=${IMMICH_BACKUP_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${IMMICH_BACKUP_S3_SECRET_KEY}
