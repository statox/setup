---
# Recreating instructions at https://docs.docker.com/engine/install/ubuntu/

- name: Install dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - ca-certificates
    - curl
    - gnupg
    - lsb-release

- name: Check if the key exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: key_file

- name: Add Docker's official GPG key
  ansible.builtin.shell: >
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  when: not key_file.stat.exists

- name: Check if the repo source exists
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/docker.sources
  register: repo_file

- name: Get distribution version
  ansible.builtin.shell: '. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"'
  register: dist_version
  when: not repo_file.stat.exists

- name: Add Docker's repository
  ansible.builtin.template:
    dest: /etc/apt/sources.list.d/docker.sources
    src: "{{ role_path }}/files/docker.sources.j2"
  when: not repo_file.stat.exists

- name: Install docker
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  notify: restart docker

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ lookup('env', 'USER') }}"
    groups: docker
    append: true
