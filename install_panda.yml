---
- name: Setup panda machine
  hosts: panda
  become: false
  vars_files:
    - "./vars/config.local"

  roles:
    - role: system/base
      become: true
    - role: system/sudo
      become: true
    - role: system/docker
      become: true
    - role: server/firewall
      become: true
      vars:
        open_ports:
          - 443
          - 2223 # For gitea.statox.fr ssh cloning
          - 51414 # For servarr-transmission P2P
          - 51415 # For servarr-qbittorrent P2P
    - role: server/traefik
      vars:
        traefik_dashboard_domain: "panda-traefik.statox.fr"
    - role: server/portainer
      vars:
        portainer_ui_domain: "panda-portainer.statox.fr"
    - role: server/elk
      vars:
        elastic_cluster_domain: "elk.statox.fr"
        kibana_domain: "kibana.statox.fr"
        logstash_domain: "logs.statox.fr"
    - role: server/api-db
    - role: server/gitea
    - role: server/planka
      vars:
       planka_ui_domain: "kanban.statox.fr"
    - role: server/servarr
      vars:
        prowlarr_ui_domain: "prowlarr.statox.fr"
        sonarr_ui_domain: "sonarr.statox.fr"
        radarr_ui_domain: "radarr.statox.fr"
        whisparr_ui_domain: "whisparr.statox.fr"
        servarr_transmission_ui_domain: "servarr-transmission.statox.fr"
        servarr_qbittorrent_ui_domain: "torrent.statox.fr"
        servarr_jellyfin_domain: "servarr-jellyfin.statox.fr"
        bazarr_ui_domain: "bazarr.statox.fr"
        seerr_ui_domain: "seerr.statox.fr"
        # Storage Box created in the provisioning repo
        servarr_storage_box_host: "servarr-storage.statox.fr"
        # TODO Put that in the vault
        servarr_storage_box_user: "u706669"
        # Box host key, a known_hosts line: output of
        # `ssh-keyscan -p 23 -t ed25519 servarr-storage.statox.fr`, checked against
        # the fingerprint panda saw on its first connection to the box
        servarr_storage_box_host_key: "[servarr-storage.statox.fr]:23 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs"
    - role: server/immich
      vars:
        immich_ui_domain: "immich.statox.fr"
    - role: server/immich_ml_orchestrator
      vars:
        immich_ml_orchestrator_immich_url: "https://immich.statox.fr"
        immich_ml_orchestrator_ecs_cluster: "immich-ml" # matches terraform output immich_ml_ecs_cluster_name
        immich_ml_orchestrator_ecs_service: "immich-machine-learning" # matches terraform output immich_ml_ecs_service_name
        immich_ml_orchestrator_route53_zone_id: "Z004510817OJYQIQFIMQ2"
